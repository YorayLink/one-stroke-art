  #tune input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;

  .colorDot .del{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;

<div id="app">
  <button id="langBtn" aria-label="switch language">EN</button>

</div>

<script>
(() => {
"use strict";

/* ================= 基础 ================= */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const fx = document.createElement("canvas");
const fxc = fx.getContext("2d");
const bgc = document.createElement("canvas");
const bgx = bgc.getContext("2d");
let DPR = Math.min(window.devicePixelRatio || 1, 1.75);

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rngFactory=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const rand=(r,a,b)=>{const v=(typeof r==="function")?r():r;return a+(b-a)*v;};
const TAU=Math.PI*2;

function flowAngle(x,y,t){
  const s=0.0018;
  return Math.sin(x*s+t*0.42)*1.7 + Math.cos(y*s*1.25-t*0.31)*1.4 + Math.sin((x+y)*s*0.55+t*0.22)*0.9;
}

/* ================= 风格定义 ================= */
const STYLES=[
  {id:"ink",  name:"水墨",   en:"INK",        shapes:["birds","mountain","fish"], count:5200, trail:.055, comp:"source-over",
   palette:["#0a0a0a","#151515","#242424","#3a3a3a","#585858","#7d776a"], size:[1.5,3.6], bg:"inkBg"},
  {id:"vg",   name:"梵高",   en:"VAN GOGH",   shapes:["galaxy","swirl"], count:4200, trail:.032, comp:"source-over",
   palette:["#f2c14e","#e8a33d","#f6e27a","#fff3c4","#7fb3d5","#3f7fc4","#dfe9f3"], size:[1.2,3.0], bg:"vgBg"},
  {id:"monet",name:"印象派", en:"IMPRESSION", shapes:["lotus","petals"], count:3600, trail:.055, comp:"source-over",
   palette:["#f3c9b6","#e9a6a0","#c9b6d8","#a8c8d8","#f6e2a8","#d8e6c8","#ffffff"], size:[2.0,4.6], bg:"monetBg"},
  {id:"ukiyo",name:"浮世绘", en:"UKIYO-E",    shapes:["koi","wave","fish"], count:5200, trail:.07, comp:"source-over",
   palette:["#0f1b33","#14213d","#1d3f6e","#2b5a8c","#e9eef5","#f7f2e6","#c8452f"], size:[1.7,3.8], bg:"ukiyoBg"},
  {id:"neon", name:"霓虹",   en:"NEON",       shapes:["phoenix","dragon"], count:3400, trail:.026, comp:"lighter",
   palette:["#22d3ee","#a855f7","#f472b6","#7dd3fc","#ffffff"], size:[1.0,2.6], bg:"neonBg"},
  {id:"point",name:"点彩",   en:"POINTILLISM",shapes:["tree","balloon","flower"], count:7000, trail:.14, comp:"source-over",
   palette:["#1b4f8a","#2f7ab8","#7fb6d8","#f2c14e","#e07a5f","#6a994e","#3d405b","#ffffff"], size:[1.4,3.4], bg:"pointBg"},
  {id:"water",name:"水彩",   en:"WATERCOLOR", shapes:["flower","bloom","fish"], count:3400, trail:.06, comp:"multiply",
   palette:["#7fb7d9","#f2a7b3","#c7b3e0","#9ed0b0","#f6d48f","#79a6c9"], size:[2.0,4.6], bg:"waterBg"},
  {id:"custom",name:"自定义", en:"CUSTOM",    shapes:["koiSchool","butterfly","crane","dragon","landscape","silhouette","birds","flower","tree"], count:4200, trail:.05, comp:"source-over",
   palette:["#1f2937","#4f46e5","#f59e0b","#e11d48"], size:[1.6,3.8], bg:"customBg"}
];
const byId=id=>STYLES.find(s=>s.id===id);
let styleId="ink";

/* ---------- 作者 / 多语言 ---------- */
const AUTHOR="YorayLin";
const I18N={
  zh:{
    titleA:"一笔", titleB:"成画",
    sub:"ONE STROKE · LIVING FORMS",
    hint:"画一笔 → 就地化形 · 可继续叠加 · 旧笔几秒后自动淡出",
    demo:"看演示", save:"保存图片", clear:"清空",
    real:"写实", exp:"写意", bg:"背景", colors:"笔触色",
    addColor:"＋ 加颜色", delColor:"删除这个颜色",
    saved:"已保存", saveFail:"保存失败", drawMore:"再多画一点",
    none:"—", strokes:"笔", particles:"粒子", cover:"占屏", recent:"最近", realistic:"写实",
    formed:"这一笔化为「{s}」"
  },
  en:{
    titleA:"One", titleB:"Stroke",
    sub:"一笔成画 · LIVING FORMS",
    hint:"Draw a stroke → it becomes a form right where you drew · stack more · older strokes fade out",
    demo:"Demo", save:"Save image", clear:"Clear",
    real:"realistic", exp:"expressive", bg:"Background", colors:"Stroke colors",
    addColor:"+ Color", delColor:"Delete this color",
    saved:"Saved", saveFail:"Save failed", drawMore:"Draw a bit more",
    none:"—", strokes:"strokes", particles:"particles", cover:"cover", recent:"last", realistic:"realistic",
    formed:'This stroke became "{s}"'
  }
};
let lang=(()=>{
  try{const s=localStorage.getItem("os_lang");if(s==="zh"||s==="en")return s;}catch(e){}
  return (navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en";
})();
const t=k=>(I18N[lang][k]!==undefined?I18N[lang][k]:k);
let shapeIndex=0;
let seed=20261111;
let strength=0.55;
let customBgColor="#f7f2e8";
let customPalette=["#1f2937","#4f46e5","#f59e0b","#e11d48"];
const MAX_COLORS=6;
let rafId=0;
let t0=0;
let running=false;

/* ================= 尺寸 & 背景 ================= */
let W=1000,H=640;

function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  const mobile=vw<=760;
  const padX=mobile?16:(vw>900?120:20), padY=mobile?96:(vw>900?106:82);
  const ratio=mobile?clamp(vw/vh,0.62,1.35):1.55;
  let w=vw-padX*2, h=vh-padY*2;
  if(w/h>ratio) w=h*ratio; else h=w/ratio;
  W=Math.max(320,Math.round(w)); H=Math.max(210,Math.round(h));
  for(const c of [cv,fx,bgc]){ c.width=Math.round(W*DPR); c.height=Math.round(H*DPR); }
  cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  fxc.setTransform(DPR,0,0,DPR,0,0);
  bgx.setTransform(DPR,0,0,DPR,0,0);
  buildBackground();
  groups.length=0;
  lastGroup=null;
  if(typeof clearFx==="function") clearFx();
  updateMeta();
}

/* ---------- 背景绘制 ---------- */
function buildBackground(){
  const rng=rngFactory(seed);
  bgx.setTransform(1,0,0,1,0,0);
  bgx.clearRect(0,0,bgc.width,bgc.height);
  bgx.setTransform(DPR,0,0,DPR,0,0);
  const f=BACKGROUNDS[byId(styleId).bg];
  f(bgx,W,H,rng);
  drawWatermark(bgx,W,H);
}

/* 隐藏水印:几乎不可见,但会出现在截图/导出的 PNG 里,用于证明作者 */
const WM_TEXT=AUTHOR+" · YL-ONESTROKE-2026";
function drawWatermark(c,W,H){
  const dark=["vg","neon","ukiyo"].includes(styleId);
  c.save();
  c.globalAlpha=dark?0.010:0.013;
  c.fillStyle=dark?"#ffffff":"#1a1a1a";
  c.font='600 34px "Helvetica Neue",Arial,sans-serif';
  c.translate(W/2,H/2);
  c.rotate(-0.36);
  for(let y=-H;y<H;y+=170){
    for(let x=-W;x<W;x+=330){
      c.fillText(WM_TEXT,x,y);
    }
  }
  c.restore();
}

const BACKGROUNDS={
  inkBg(c,W,H,rng){
    c.fillStyle="#f7f2e8";c.fillRect(0,0,W,H);
    for(let i=0;i<2400;i++){c.fillStyle=`rgba(120,105,80,${rng()*.05})`;c.fillRect(rng()*W,rng()*H,rng()*2+1,rng()*2+1);}
    c.save();c.globalAlpha=.11;c.fillStyle="#2b2b2b";
    for(let k=0;k<3;k++){
      c.beginPath();c.moveTo(0,H*.74+k*16);
      for(let x=0;x<=W;x+=36){
        const y=H*.72+k*16+Math.sin(x*.006+k*2)*24+Math.sin(x*.014+k)*9;
        c.lineTo(x,y);
      }
      c.lineTo(W,H);c.lineTo(0,H);c.closePath();c.fill();
    }
    c.restore();
    c.save();c.fillStyle="#2a2a2a";c.font='600 24px "STKaiti","KaiTi",serif';
    c.fillText("一 笔",W-142,H*.12);
    c.font='400 12px "STKaiti","KaiTi",serif';c.fillStyle="#6b6b6b";c.fillText("化 形",W-134,H*.12+22);
    c.restore();
    seal(c,W-86,H*.12-34,52,"一画");
  },
  vgBg(c,W,H,rng){
    const g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#0a1430");g.addColorStop(.5,"#122a4d");g.addColorStop(1,"#07101f");
    c.fillStyle=g;c.fillRect(0,0,W,H);
    for(let i=0;i<7;i++){
      const sx=rand(rng,W*.05,W*.95), sy=rand(rng,H*.05,H*.42), r=rand(rng,8,15);
      const gg=c.createRadialGradient(sx,sy,0,sx,sy,r*4.5);
      gg.addColorStop(0,"rgba(255,246,190,.95)");gg.addColorStop(.35,"rgba(255,230,140,.35)");gg.addColorStop(1,"rgba(255,230,140,0)");
      c.fillStyle=gg;c.beginPath();c.arc(sx,sy,r*4.5,0,TAU);c.fill();
      c.fillStyle="#fff7cf";c.beginPath();c.arc(sx,sy,r*.5,0,TAU);c.fill();
    }
  },
  monetBg(c,W,H,rng){
    const g=c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#f6e7d8");g.addColorStop(.4,"#e8d8e6");g.addColorStop(.58,"#bcd3df");g.addColorStop(1,"#8fb3c4");
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.globalAlpha=.32;c.fillStyle="#fff";
    for(let i=0;i<5;i++){c.beginPath();c.ellipse(rand(rng,0,W),rand(rng,H*.08,H*.36),rand(rng,60,180),rand(rng,9,24),0,0,TAU);c.fill();}
    c.globalAlpha=1;
    c.strokeStyle="rgba(255,255,255,.35)";c.lineWidth=1.2;
    c.beginPath();c.moveTo(0,H*.58);c.lineTo(W,H*.58);c.stroke();
  },
  ukiyoBg(c,W,H,rng){
    c.fillStyle="#f4ead7";c.fillRect(0,0,W,H);
    c.fillStyle="#c8452f";c.globalAlpha=.9;c.beginPath();c.arc(W*.76,H*.22,Math.min(W,H)*.10,0,TAU);c.fill();c.globalAlpha=1;
    for(let k=0;k<4;k++){
      const baseY=H*(.64+k*.10);
      c.fillStyle=k%2?"#1d3f6e":"#2b5a8c";c.globalAlpha=.9;
      c.beginPath();c.moveTo(0,H);
      for(let x=0;x<=W;x+=8){const y=baseY+Math.sin(x*.012+k)*20+Math.sin(x*.03+k*2)*7;c.lineTo(x,y);}
      c.lineTo(W,H);c.closePath();c.fill();
    }
    c.globalAlpha=.95;c.fillStyle="#f7f2e6";
    for(let i=0;i<30;i++){c.beginPath();c.arc(rand(rng,0,W),rand(rng,H*.58,H*.9),rand(rng,1.4,3.4),0,TAU);c.fill();}
    c.globalAlpha=1;
    seal(c,W-84,H-104,50,"浮世");
  },
  neonBg(c,W,H,rng){
    const g=c.createLinearGradient(0,0,W,H);
    g.addColorStop(0,"#05070d");g.addColorStop(1,"#0a0614");
    c.fillStyle=g;c.fillRect(0,0,W,H);
    c.strokeStyle="rgba(80,200,255,.07)";c.lineWidth=1;
    for(let x=0;x<W;x+=44){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
    for(let y=0;y<H;y+=44){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
    const gl=c.createRadialGradient(W*.5,H*.5,10,W*.5,H*.5,Math.max(W,H)*.6);
    gl.addColorStop(0,"rgba(120,60,255,.16)");gl.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=gl;c.fillRect(0,0,W,H);
  },
  pointBg(c,W,H,rng){
    c.fillStyle="#f7f4ec";c.fillRect(0,0,W,H);
    for(let i=0;i<1800;i++){c.fillStyle=`rgba(150,140,120,${rng()*.045})`;c.fillRect(rng()*W,rng()*H,1.6,1.6);}
  },
  waterBg(c,W,H,rng){
    c.fillStyle="#fbf8f1";c.fillRect(0,0,W,H);
    for(let i=0;i<2200;i++){c.fillStyle=`rgba(140,125,100,${rng()*.05})`;c.fillRect(rng()*W,rng()*H,rng()*2+1,rng()*2+1);}
  },
  customBg(c,W,H,rng){
    c.fillStyle=customBgColor||"#f7f2e8";

function seal(c,x,y,size,text){
  c.save();
  c.fillStyle="#b3352c";c.globalAlpha=.92;
  c.beginPath();c.roundRect(x,y,size,size,size*.12);c.fill();
  c.strokeStyle="rgba(255,255,255,.75)";c.lineWidth=1.1;
  c.beginPath();c.roundRect(x+3,y+3,size-6,size-6,size*.1);c.stroke();
  c.fillStyle="#fdf7ef";c.textAlign="center";c.textBaseline="middle";
  c.font=`600 ${size*.42}px "STKaiti","KaiTi",serif`;
  const chars=text.split("");const step=size/(chars.length+1);
  chars.forEach((ch,i)=>c.fillText(ch,x+size/2,y+step*(i+1)));
  c.restore();
}

/* ================= 笔迹 → 粒子 ================= */
function pathSamples(points, step){
  const out=[];
  if(points.length<2) return out;
  let acc=0,prev=points[0];
  for(let i=1;i<points.length;i++){
    const p=points[i], d=Math.hypot(p.x-prev.x,p.y-prev.y);
    if(d<0.01){prev=p;continue;}
    while(acc+step<=d){
      const k=(acc+step)/d;
      out.push({x:prev.x+(p.x-prev.x)*k,y:prev.y+(p.y-prev.y)*k});
      acc+=step;
    }
    acc=acc-d>0?acc-d:0;prev=p;
  }
  return out;
}

/* ================= 形态生成 ================= */
function qbez(p0,p1,p2,n){
  const out=[];
  for(let i=0;i<=n;i++){
    const t=i/n,u=1-t;
    out.push({x:u*u*p0.x+2*u*t*p1.x+t*t*p2.x, y:u*u*p0.y+2*u*t*p1.y+t*t*p2.y});
  }
  return out;
}
function ellipsePts(cx,cy,rx,ry,rot,n,from=0,to=TAU){
  const out=[];
  for(let i=0;i<=n;i++){
    const a=from+(to-from)*i/n;
    const x=Math.cos(a)*rx, y=Math.sin(a)*ry;
    out.push({x:cx+x*Math.cos(rot)-y*Math.sin(rot), y:cy+x*Math.sin(rot)+y*Math.cos(rot)});
  }
  return out;
}
function scatter(cx,cy,r,n,rng,ry){
  const out=[];
  for(let i=0;i<n;i++){
    const a=rng()*TAU, rr=Math.pow(rng(),.6);
    out.push({x:cx+Math.cos(a)*rr*r, y:cy+Math.sin(a)*rr*(ry||r)});
  }
  return out;
}

// 所有风格都追加通用形态
const COMMON_SHAPES=["koiSchool","butterfly","crane","dragon","landscape","silhouette","bamboo","plum","boat","pavilion","deer","cat","clouds","moon"];
STYLES.forEach(s=>{ for(const k of COMMON_SHAPES){ if(!s.shapes.includes(k)) s.shapes.push(k); } });

/* ================= 笔迹特征 & 形态选择 ================= */
function hashPoints(pts){
  let h=2166136261;
  for(let i=0;i<pts.length;i+=3){
    h^=Math.round(pts[i].x*7+pts[i].y*13);
    h=Math.imul(h,16777619);
  }
  return h>>>0;
}
function analyzeStroke(pts){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,len=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
    if(i) len+=Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y);
  }
  const w=Math.max(1,maxX-minX), h=Math.max(1,maxY-minY);
  const chord=Math.hypot(pts[pts.length-1].x-pts[0].x,pts[pts.length-1].y-pts[0].y);
  let turn=0;
  for(let i=2;i<pts.length;i++){
    const a1=Math.atan2(pts[i-1].y-pts[i-2].y,pts[i-1].x-pts[i-2].x);
    const a2=Math.atan2(pts[i].y-pts[i-1].y,pts[i].x-pts[i-1].x);
    let d=a2-a1;
    while(d>Math.PI)d-=TAU;
    while(d<-Math.PI)d+=TAU;
    turn+=Math.abs(d);
  }
  return {minX,minY,maxX,maxY,w,h,len,chord,turn,curv:len>1?turn/len:0};
}

  bamboo:"竹",plum:"梅",boat:"小舟",pavilion:"亭",deer:"鹿",cat:"猫",clouds:"云",moon:"月"
};

  birds:"Birds",mountain:"Mountain",fish:"Fish",galaxy:"Galaxy",swirl:"Swirl",
  lotus:"Lotus",petals:"Petals",koi:"Koi",wave:"Wave",phoenix:"Phoenix",

  bamboo:"Bamboo",plum:"Plum",boat:"Boat",pavilion:"Pavilion",deer:"Deer",cat:"Cat",clouds:"Clouds",moon:"Moon"
};
function shapeLabel(name){return (lang==="en"?SHAPE_LABEL_EN[name]:SHAPE_LABEL[name])||name;}

function chooseShape(f,rng){
  const diag=Math.hypot(f.w,f.h);
  const small=diag<Math.min(W,H)*0.20;
  const closed=f.chord<f.len*0.30 && f.len>diag*1.5;
  const wide=f.w>f.h*1.9;
  const tall=f.h>f.w*1.7;
  let pool;
  if(small)        pool=["butterfly","fish","flower","birds"];
  else if(closed)  pool=["lotus","flower","koi"];
  else if(wide)    pool=["wave","landscape","koiSchool","dragon"];
  else if(tall)    pool=["tree","crane","silhouette"];
  else if(f.curv>0.9) pool=["dragon","crane","birds"];
  else             pool=["birds","koiSchool","butterfly","crane","landscape"];
  return pool[Math.floor(rng()*pool.length)%pool.length];
}

function shapePointsLocal(kind,n,bw,bh,rng){
  const fn=SHAPES[kind]||SHAPES.birds;
  const raw=fn(bw,bh,rng);
  if(!raw.length) return [];
  const out=[];
  for(let i=0;i<n;i++){
    const p=raw[Math.floor(i/n*raw.length)%raw.length];
    out.push({x:p.x+rand(rng,-2.2,2.2),y:p.y+rand(rng,-2.2,2.2)});
  }
  return out;
}

/* ================= 多笔系统 ================= */
const groups=[];
let lastGroup=null;
const BASE_LIFE=7.5;      // 单笔基础停留秒数
const MIN_VISIBLE=5.5;    // 最新一笔的最短可见时间(含成形过程)
const FORM_GRACE=3.0;     // 成形期:未超过这个时间不参与淘汰
const COVER_SOFT=0.55;    // 画面占比超过 55% 开始压缩旧笔寿命
const COVER_HARD=0.92;    // 超过 92% 才考虑移除最旧的笔
const MAX_TOTAL=12000;    // 全屏粒子上限

function createGroup(points,forcedShape){
  const st=byId(styleId);
  const samples=pathSamples(points,3);
  if(samples.length<2){toast("再多画一点");return null;}
  const f=analyzeStroke(points);
  const hash=hashPoints(points);
  const rng=rngFactory((seed^hash)>>>0);
  const kind=forcedShape||chooseShape(f,rng);
  const pad=Math.max(20,Math.max(f.w,f.h)*0.10);
  const bx=f.minX-pad, by=f.minY-pad;
  const bw=Math.max(120,f.w+pad*2), bh=Math.max(120,f.h+pad*2);

  let N=Math.round(clamp(st.count*0.50,1200,4000)*(W<600?0.55:1));
  const used=groups.reduce((a,g)=>a+g.particles.length,0);
  if(used+N>MAX_TOTAL) N=Math.max(700,MAX_TOTAL-used);
  if(N<650 && groups.length){ groups.shift(); }

  const targets=shapePointsLocal(kind,N,bw,bh,rng);
  const jitter=0.6+4.9*strength;
  const particles=[];
  for(let i=0;i<N;i++){
    const s=samples[Math.floor(i/N*samples.length)%samples.length];
    const tg=targets[i]||{x:bw/2,y:bh/2};
    const ci=Math.min(st.palette.length-1,Math.floor(i/N*st.palette.length+rng()*1.2));
    particles.push({
      ox:s.x+rand(rng,-jitter,jitter), oy:s.y+rand(rng,-jitter,jitter),
      tx:bx+tg.x, ty:by+tg.y,
      color:st.palette[ci],
      size:rand(rng,st.size[0],st.size[1]),
      delay:rng()*0.40,
      phase:rng()*TAU,
      amp:rand(rng,16,50),
      amb:rand(rng,3,9),
      lx:s.x, ly:s.y
    });
  }
  const g={particles,birth:performance.now()/1000,styleId,shapeName:kind,
    box:{x:bx,y:by,w:bw,h:bh},hash,points:points.slice()};
  groups.push(g);
  lastGroup=g;
  while(groups.length>5) groups.shift();
  updateMeta();
  toast(t("formed").replace("{s}",shapeLabel(kind)));
  return g;
}

/* ================= 动画 ================= */
function particlePos(p,t){
  const e=smooth((t-p.delay)/1.9);
  const baseX=lerp(p.ox,p.tx,e), baseY=lerp(p.oy,p.ty,e);
  const ang=flowAngle(p.ox*0.7+p.tx*0.3, p.oy*0.7+p.ty*0.3, t);
  const flow=((1-e)*p.amp*1.4 + p.amb)*(0.25+1.4*strength);
  const fx=Math.cos(ang)*flow*Math.sin(t*.9+p.phase);
  const fy=Math.sin(ang)*flow*Math.cos(t*.8+p.phase*1.3);
  const wob=(1-e)*Math.sin(t*2.1+p.phase)*5*Math.sin(t*1.3+.5);
  return [baseX+fx+wob, baseY+fy+wob*.4];
}

function drawFrame(now){
  const st=byId(styleId);
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=1;
  ctx.drawImage(bgc,0,0,W,H);

  // 全局拖尾衰减
  fxc.globalCompositeOperation="destination-out";
  fxc.globalAlpha=1;
  fxc.fillStyle=`rgba(0,0,0,${st.trail*(0.55+1.25*strength)})`;
  fxc.fillRect(0,0,W,H);
  fxc.globalCompositeOperation="source-over";

  let usedArea=0;
  for(const g of groups) usedArea+=g.box.w*g.box.h;
  let cover=usedArea/(W*H);
  // 硬上限:只淘汰"已经成形、且超过最短可见时间"的旧笔;最新一笔永远先保留
  while(groups.length>1 && cover>COVER_HARD){
    const oldest=groups[0];
    if(now-oldest.birth < FORM_GRACE) break;   // 刚生成的一笔不参与淘汰
    const removed=groups.shift();
    usedArea-=removed.box.w*removed.box.h;
    cover=usedArea/(W*H);
  }
  // 单笔不压缩;多笔时压缩旧笔,但最新一笔保留最短可见时间
  const solo=groups.length<=1;
  const lifeScale = solo ? 1 : (cover<=COVER_SOFT ? 1 : clamp(1-(cover-COVER_SOFT)/(COVER_HARD-COVER_SOFT)*0.72,0.40,1));
  const baseLife=BASE_LIFE*lifeScale;

  for(let gi=groups.length-1;gi>=0;gi--){
    const g=groups[gi];
    const age=now-g.birth;
    const isNewest=(g===groups[groups.length-1]);
    const gLife=isNewest?Math.max(baseLife,MIN_VISIBLE):baseLife;
    if(age>gLife){groups.splice(gi,1);continue;}
    const fade=age>gLife-1.3?Math.max(0,(gLife-age)/1.3):1;
    const gs=byId(g.styleId);
    for(const p of g.particles){
      let [x,y]=particlePos(p,age);
      if(pointer.active){
        const dx=x-pointer.x, dy=y-pointer.y, d2=dx*dx+dy*dy;
        if(d2<150*150){
          const d=Math.sqrt(d2)||1, f=(1-d/150)*26;
          x+=dx/d*f; y+=dy/d*f;
        }
      }
      const ang=Math.atan2(y-p.ly,x-p.lx)||0;
      p.lx=x; p.ly=y;
      drawParticle(gs,p,x,y,ang,fade);
    }
    if(gs.id==="ink"){
      fxc.globalCompositeOperation="source-over";
      for(let i=0;i<g.particles.length;i+=2){
        const p=g.particles[i];
        const e=smooth((age-p.delay)/1.9);
        if(e<.25) continue;
        fxc.globalAlpha=.07*e*fade;
        fxc.fillStyle="#242424";
        fxc.beginPath();fxc.arc(p.tx,p.ty,Math.max(5,p.size*3.6),0,TAU);fxc.fill();
      }
    }
  }
  fxc.globalAlpha=1;

  ctx.globalCompositeOperation=st.comp;
  ctx.drawImage(fx,0,0,W,H);
  ctx.globalCompositeOperation="source-over";

  drawStrokePreview();
}

function drawStrokePreview(){
  if(!drawing||stroke.length<2) return;
  ctx.save();
  ctx.globalAlpha=.72;ctx.strokeStyle="#7dd3c0";ctx.lineWidth=2;ctx.lineCap="round";ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(stroke[0].x,stroke[0].y);
  for(let i=1;i<stroke.length;i++) ctx.lineTo(stroke[i].x,stroke[i].y);
  ctx.stroke();ctx.restore();
}

function drawParticle(st,p,x,y,ang,fade){
  const c=fxc;
  const size=p.size*(0.62+0.83*strength);
  switch(st.id){
    case "ink":
      c.globalAlpha=.72*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size,0,TAU);c.fill();
      if(strength>0.3 && (p.phase*100|0)%5===0){
        c.globalAlpha=.18*fade;c.strokeStyle=p.color;c.lineWidth=size*.7;
        c.beginPath();c.moveTo(p.lx,p.ly);c.lineTo(x,y);c.stroke();
      }
      break;
    case "vg":
      c.globalAlpha=.78*fade;c.fillStyle=p.color;
      c.beginPath();c.ellipse(x,y,size*2.6,size*.85,ang,0,TAU);c.fill();
      if(strength>0.4 && (p.phase*10|0)%4===0){
        c.globalAlpha=.42*fade;c.fillStyle="#fff8d8";
        c.beginPath();c.ellipse(x,y,size*1.2,size*.4,ang,0,TAU);c.fill();
      }
      break;
    case "monet":
      c.globalAlpha=.38*fade;c.fillStyle=p.color;
      c.beginPath();c.ellipse(x,y,size*2.4,size*1.2,ang,0,TAU);c.fill();
      if((p.phase*9|0)%3===0){
        c.globalAlpha=.15*fade;
        c.beginPath();c.arc(x,y,size*4.2,0,TAU);c.fill();
      }
      break;
    case "ukiyo":
      c.globalAlpha=.9*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size*.95,0,TAU);c.fill();
      if(strength>0.35 && (p.phase*7|0)%6===0){
        c.globalAlpha=.4*fade;c.strokeStyle="#f7f2e6";c.lineWidth=1.1;
        c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(ang)*8,y+Math.sin(ang)*8);c.stroke();
      }
      break;
    case "neon":
      c.globalAlpha=.07*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size*5.2,0,TAU);c.fill();
      c.globalAlpha=.92*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size*.9,0,TAU);c.fill();
      c.globalAlpha=.22*fade;c.strokeStyle=p.color;c.lineWidth=size*.8;
      c.beginPath();c.moveTo(p.lx,p.ly);c.lineTo(x,y);c.stroke();
      break;
    case "point":
      c.globalAlpha=.9*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size,0,TAU);c.fill();
      break;
    case "water":
      c.globalAlpha=.13*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size*2.8,0,TAU);c.fill();
      if((p.phase*8|0)%3===0){
        c.globalAlpha=.06*fade;
        c.beginPath();c.arc(x,y,size*5.6,0,TAU);c.fill();
      }
      break;
    case "custom":
      c.globalAlpha=.55*fade;c.fillStyle=p.color;
      c.beginPath();c.arc(x,y,size*1.35,0,TAU);c.fill();
      if((p.phase*10|0)%3===0){
        c.globalAlpha=.16*fade;
        c.beginPath();c.arc(x,y,size*3.6,0,TAU);c.fill();
      }
      break;
  }
}

/* ================= 交互:多笔叠加 ================= */
let drawing=false;
let stroke=[];
const pointer={x:-9999,y:-9999,active:false};

function pos(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H, t:performance.now()};
}
let activePointer=null;
cv.addEventListener("pointerdown",e=>{
  if(activePointer!==null) return;              // 多指触控只认第一根手指
  activePointer=e.pointerId;
  clearDemoTimers();
  drawing=true;stroke=[];
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  stroke.push(pos(e));
  document.getElementById("hint").style.opacity=.25;
  if(e.cancelable) e.preventDefault();
},{passive:false});
cv.addEventListener("pointermove",e=>{
  if(e.pointerType!=="mouse" && !drawing) return;   // 触屏只在落笔时生效,避免误触起风
  const r=cv.getBoundingClientRect();
  pointer.x=(e.clientX-r.left)/r.width*W;
  pointer.y=(e.clientY-r.top)/r.height*H;
  pointer.active=true;
  if(!drawing || e.pointerId!==activePointer) return;
  const p=pos(e), last=stroke[stroke.length-1];
  if(!last||Math.hypot(p.x-last.x,p.y-last.y)>1.5) stroke.push(p);
});
function endStroke(e){
  if(!drawing) return;
  drawing=false;activePointer=null;
  if(e&&e.pointerType!=="mouse") pointer.active=false;
  if(stroke.length>2) createGroup(stroke.slice());
  else toast(t("drawMore"));
  stroke=[];
  try{if(e)cv.releasePointerCapture(e.pointerId);}catch(_){}
}
cv.addEventListener("pointerup",endStroke);
cv.addEventListener("pointercancel",()=>{drawing=false;stroke=[];activePointer=null;pointer.active=false;});
cv.addEventListener("pointerleave",()=>{pointer.active=false;});
/* iOS:阻止双指缩放/页面滚动打断绘画 */
cv.addEventListener("touchmove",e=>{if(e.cancelable)e.preventDefault();},{passive:false});

/* ================= 演示:三笔三种形态 ================= */
function demoStroke(kind){
  const out=[],N=150,t0=performance.now();
  for(let i=0;i<=N;i++){
    const t=i/N;let x,y;
    if(kind==="wide"){
      x=W*(.10+.80*t);
      y=H*(.46+Math.sin(t*Math.PI*2)*.10);
    }else if(kind==="loop"){
      const a=t*TAU*1.15;
      x=W*.24+Math.cos(a)*W*.09;
      y=H*.70+Math.sin(a)*H*.09;
    }else{
      x=W*(.78+Math.sin(t*Math.PI*1.5)*.06);
      y=H*(.24+.52*t);
    }
    out.push({x,y,t:t0+i*9});
  }
  return out;
}
function runDemo(){
  groups.length=0;clearFx();

  const items=[
    {kind:"wide",shape:"koiSchool",delay:0},
    {kind:"loop",shape:"flower",delay:900},
    {kind:"vertical",shape:"crane",delay:1800}
  ];
  items.forEach(it=>{
    demoTimers.push(setTimeout(()=>createGroup(demoStroke(it.kind),it.shape),it.delay));
  });
}

function clearFx(){

}

/* ---------- PNG 元数据水印(把作者写进文件里) ---------- */
const CRC_TABLE=(()=>{
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
  return t;
})();
function crc32(buf){
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function pngTextChunk(key,val){
  const enc=new TextEncoder();
  const data=new Uint8Array(enc.encode(key).length+1+enc.encode(val).length);
  data.set(enc.encode(key),0); data[enc.encode(key).length]=0;
  data.set(enc.encode(val),enc.encode(key).length+1);
  const out=new Uint8Array(12+data.length);
  const dv=new DataView(out.buffer);
  dv.setUint32(0,data.length);
  out.set(enc.encode("tEXt"),4);
  out.set(data,8);
  dv.setUint32(8+data.length,crc32(out.subarray(4,8+data.length)));
  return out;
}
function findIEND(bytes){
  for(let i=8;i<bytes.length-8;){
    const len=((bytes[i]<<24)|(bytes[i+1]<<16)|(bytes[i+2]<<8)|bytes[i+3])>>>0;
    const type=String.fromCharCode(bytes[i+4],bytes[i+5],bytes[i+6],bytes[i+7]);
    if(type==="IEND") return i;
    if(len>bytes.length) return -1;
    i+=12+len;
  }
  return -1;
}
function withPngMeta(dataURL,entries){
  const bin=atob(dataURL.split(",")[1]);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const iend=findIEND(bytes);
  if(iend<0) return dataURL;
  const chunks=entries.map(([k,v])=>pngTextChunk(k,v));
  const total=chunks.reduce((a,c)=>a+c.length,0);
  const out=new Uint8Array(bytes.length+total);
  out.set(bytes.subarray(0,iend),0);
  let off=iend;
  for(const c of chunks){out.set(c,off);off+=c.length;}
  out.set(bytes.subarray(iend),off);
  let s="";
  for(let i=0;i<out.length;i+=8192) s+=String.fromCharCode.apply(null,out.subarray(i,i+8192));
  return "data:image/png;base64,"+btoa(s);
}

window.__bench=(n)=>{
  n=n||20;const a=performance.now();
  for(let k=0;k<n;k++) drawFrame(performance.now()/1000+k*0.016);
  return Math.round((performance.now()-a)/n*10)/10;
};
window.__status=()=>{
  const area=groups.reduce((a,g)=>a+g.box.w*g.box.h,0);
  const cover=area/(W*H);
  const solo=groups.length<=1;
  const lifeScale = solo ? 1 : (cover<=COVER_SOFT ? 1 : clamp(1-(cover-COVER_SOFT)/(COVER_HARD-COVER_SOFT)*0.72,0.40,1));
  return {
    count:groups.length,
    shapes:groups.map(g=>g.shapeName),
    total:groups.reduce((a,g)=>a+g.particles.length,0),
    cover:Math.round(cover*100),
    lifeScale:Math.round(lifeScale*100)/100,
    life:Math.round(Math.max(BASE_LIFE*lifeScale,MIN_VISIBLE)*10)/10
  };
};
window.__advance=(sec)=>{ drawFrame(performance.now()/1000+(sec||0)); return window.__status(); };
/* 测试钩子:导出带元数据的 PNG / 生成加水印的对比增强图 */
window.__wmTest=()=>{
  const d=withPngMeta(cv.toDataURL("image/png"),[["Author",AUTHOR]]);
  const b=atob(d.split(",")[1]);
  return {hasText:b.includes("tEXt"),hasAuthor:b.includes("YorayLin"),bytes:b.length,dataURL:d};
};
window.__wmProof=()=>{
  const t=document.createElement("canvas");
  t.width=560;t.height=320;
  const tc=t.getContext("2d");
  tc.drawImage(bgc,Math.round(W*0.12),Math.round(H*0.18),560,320,0,0,560,320);
  const img=tc.getImageData(0,0,560,320),d=img.data;
  for(let i=0;i<d.length;i+=4){
    const lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
    const v=Math.max(0,Math.min(255,128+(lum-244)*42));
    d[i]=d[i+1]=d[i+2]=v;
  }
  tc.putImageData(img,0,0);
  return t.toDataURL("image/png");
};
